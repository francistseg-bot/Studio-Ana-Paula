<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="18" fill="#09090b" />
  <!-- Accent Outer Ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#tealGrad)" stroke-width="2" stroke-dasharray="140 30" />
  <!-- Monogram AP -->
  <text x="32" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#2dd4bf" text-anchor="middle" letter-spacing="-1">AP</text>
  <!-- Subtle accent dot -->
  <circle cx="44" cy="21" r="3" fill="#38bdf8" />
</svg>
